services:
  # One-shot volume cleanup: removes superseded corpus directories before the
  # service starts. Never list the live KB_BOOTSTRAP_ROOT corpus here —
  # deleting it forces a full bundle re-download on every deploy. When a
  # refresh moves the live corpus (e.g. corpus3 -> corpus4), retire the old
  # directories by adding them to this list in the same commit.
  volume-cleanup:
    image: alpine:3.20
    command: sh -c 'cd /data && ls -d corpus* 2>/dev/null; rm -rf corpus corpus2 corpus3 corpus4 corpus5 && echo "volume cleanup done"'
    volumes:
      - curriculum-kb-data:/data
    networks:
      - coolify
    restart: "no"
  curriculum-kb:
    build: .
    restart: unless-stopped
    depends_on:
      volume-cleanup:
        condition: service_completed_successfully
    env_file:
      - .env
    networks:
      - coolify
    labels:
      traefik.enable: "true"
      traefik.http.middlewares.kwdb-redirect.redirectscheme.scheme: https
      traefik.http.routers.kwdb-http.entrypoints: http
      traefik.http.routers.kwdb-http.rule: Host(`kwdb.zobeidi.com`)
      traefik.http.routers.kwdb-http.middlewares: kwdb-redirect
      traefik.http.routers.kwdb-http.service: kwdb
      traefik.http.routers.kwdb.entrypoints: https
      traefik.http.routers.kwdb.rule: Host(`kwdb.zobeidi.com`)
      traefik.http.routers.kwdb.tls: "true"
      traefik.http.routers.kwdb.tls.certresolver: letsencrypt
      traefik.http.routers.kwdb.service: kwdb
      traefik.http.services.kwdb.loadbalancer.server.port: "3000"
    volumes:
      - curriculum-kb-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz',{headers:{authorization:'Bearer '+process.env.KB_API_TOKEN}}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  curriculum-kb-data:
    external: true
    name: lcgipmxidt1feeqzzklkvg7y_curriculum-kb-data

networks:
  coolify:
    external: true
